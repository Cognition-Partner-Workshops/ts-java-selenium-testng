<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees - Employee Management System (.NET MVC)</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard" class="brand">Employee Management (.NET MVC)</a>
    <div class="nav-links">
      <a href="/dashboard" id="nav-dashboard">Dashboard</a>
      <a href="/employees" class="active" id="nav-employees">Employees</a>
      <a href="#" onclick="logout()" id="nav-logout">Logout</a>
    </div>
  </nav>
  <div class="container">
    <div class="page-header">
      <h1>Employee List</h1>
      <a href="/employees/add" class="btn btn-success" id="addEmployeeBtn">+ Add Employee</a>
    </div>
    <div class="alert alert-success" id="successAlert"></div>
    <div class="card">
      <div class="table-container">
        <table id="employeeTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Salary</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody">
            <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>Confirm Delete</h3>
      <p>Are you sure you want to delete this employee? This action cannot be undone.</p>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
  <div class="footer">
    <p>&copy; 2024 Employee Management System - Legacy .NET MVC Application</p>
  </div>
  <script>
    let deleteId = null;
    (function() {
      const user = JSON.parse(localStorage.getItem('user') || 'null');
      if (!user) { window.location.href = '/login'; return; }
      loadEmployees();
    })();
    async function loadEmployees() {
      try {
        const res = await fetch('/api/employees');
        const data = await res.json();
        const tbody = document.getElementById('employeeTableBody');
        if (data.success && data.data.length > 0) {
          tbody.innerHTML = data.data.map(emp => `
            <tr data-id="${emp.id}">
              <td>${emp.id}</td>
              <td>${emp.name}</td>
              <td>${emp.email}</td>
              <td>${emp.department}</td>
              <td>$${emp.salary.toLocaleString()}</td>
              <td class="actions">
                <button class="btn btn-primary btn-sm" onclick="editEmployee(${emp.id})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="showDeleteModal(${emp.id})">Delete</button>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No employees found</td></tr>';
        }
      } catch (err) { console.error('Failed to load employees', err); }
    }
    function editEmployee(id) { window.location.href = '/employees/add?id=' + id; }
    function showDeleteModal(id) {
      deleteId = id;
      document.getElementById('deleteModal').classList.add('active');
    }
    function closeDeleteModal() {
      deleteId = null;
      document.getElementById('deleteModal').classList.remove('active');
    }
    async function confirmDelete() {
      if (!deleteId) return;
      try {
        const res = await fetch('/api/employees/' + deleteId, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          closeDeleteModal();
          const alert = document.getElementById('successAlert');
          alert.textContent = 'Employee deleted successfully';
          alert.style.display = 'block';
          setTimeout(() => { alert.style.display = 'none'; }, 3000);
          loadEmployees();
        }
      } catch (err) { console.error('Failed to delete employee', err); }
    }
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login';
    }
  </script>
</body>
</html>
