<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Employee Management System (.NET MVC)</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box" id="loginBox">
      <h1>Employee Management</h1>
      <p class="subtitle">Legacy .NET MVC Application</p>
      <div class="alert alert-danger" id="errorAlert"></div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
      </form>
      <p class="subtitle" style="margin-top:16px;font-size:12px;">Demo: admin/admin123 or user1/pass123</p>
    </div>
  </div>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      errorAlert.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/dashboard';
        } else {
          errorAlert.textContent = data.message || 'Login failed';
          errorAlert.style.display = 'block';
        }
      } catch (err) {
        errorAlert.textContent = 'Connection error. Please try again.';
        errorAlert.style.display = 'block';
      }
    }
  </script>
</body>
</html>
