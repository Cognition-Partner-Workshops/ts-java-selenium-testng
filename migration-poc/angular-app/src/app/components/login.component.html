<div class="login-container">
  <div class="login-box" id="loginBox">
    <h1>Employee Management</h1>
    <p class="subtitle">Angular Application</p>
    <div class="alert alert-danger" *ngIf="errorMessage" id="errorAlert">{{ errorMessage }}</div>
    <form (ngSubmit)="onSubmit()" id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn" [disabled]="loading">
        {{ loading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>
    <p class="subtitle" style="margin-top:16px;font-size:12px;">Demo: admin/admin123 or user1/pass123</p>
  </div>
</div>
