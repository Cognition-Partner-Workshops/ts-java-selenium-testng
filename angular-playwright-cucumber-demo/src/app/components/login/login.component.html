<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Login</h1>

    <div *ngIf="errorMessage" class="error-banner" data-testid="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter your username"
          data-testid="username-input"
          [class.input-error]="usernameError"
        />
        <span *ngIf="usernameError" class="field-error" data-testid="username-error">
          {{ usernameError }}
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          data-testid="password-input"
          [class.input-error]="passwordError"
        />
        <span *ngIf="passwordError" class="field-error" data-testid="password-error">
          {{ passwordError }}
        </span>
      </div>

      <button type="submit" class="login-button" data-testid="login-button">
        Login
      </button>
    </form>

    <div class="demo-credentials">
      <p><strong>Demo Credentials:</strong></p>
      <p>Username: <code>admin</code></p>
      <p>Password: <code>password123</code></p>
    </div>
  </div>
</div>
