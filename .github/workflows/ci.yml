name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Selenium 4.25 / WebDriverManager 5.9 need a Java 11+ runtime; sources still compile at -source/-target 1.8 per pom.xml.
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: temurin

jobs:
  build:
    name: Build (compile + test-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Resolve dependencies and compile tests
        run: mvn -B -ntp clean test-compile

  lint:
    name: Lint (POM validation + javac warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # The repo configures no Checkstyle/Spotless/PMD; this validates the POM and surfaces compiler/deprecation warnings.
      - name: Validate POM and compile with warnings
        run: mvn -B -ntp -Dmaven.compiler.showWarnings=true -Dmaven.compiler.showDeprecation=true validate test-compile

  test:
    name: Test (headless Chrome, TestNG suite)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Ensure email reporting is disabled
        run: grep -qx 'mail.sendmail=false' src/test/resources/config/test.properties
      - name: Show Chrome version
        run: google-chrome --version
      # Pre-existing failures on unmodified main: both suite tests hit live third-party sites
      # (google.co.in, facebook.com). FaceBookLoginTest fails by design (#email locator gone and
      # a hardcoded assert), and GoogleSearchTest fails from datacenter IPs (consent/bot page).
      - name: Run TestNG suite (mvn test)
        continue-on-error: true
        run: mvn -B -ntp test
      - name: Upload Surefire / TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
      # Screenshots are embedded as base64 images inside the ExtentReports HTML.
      - name: Upload ExtentReports HTML (with screenshots) and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: |
            ExtentReports/
            logfile.log
          if-no-files-found: warn

  package:
    name: Package (test-jar, default branch only)
    runs-on: ubuntu-latest
    needs: [build, lint, test]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Package framework jars
        run: mvn -B -ntp -DskipTests package jar:test-jar
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: selenium-testng-framework-jars
          path: target/*.jar
          if-no-files-found: error

  sonarqube:
    name: SonarQube scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
    steps:
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not configured; skipping SonarQube scan."
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != ''
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Run SonarQube analysis
        if: env.SONAR_TOKEN != ''
        run: >-
          mvn -B -ntp -DskipTests test-compile
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.projectKey=ts-java-selenium-testng
